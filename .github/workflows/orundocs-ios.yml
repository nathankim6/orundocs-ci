name: orundocs-ios

on:
  workflow_dispatch:
    inputs:
      run_archive:
        description: "Build unsigned Release xcarchive"
        type: boolean
        default: true
      run_tests:
        description: "Run simulator UI tests"
        type: boolean
        default: true
      ipad:
        description: "Also run the iPad simulator"
        type: boolean
        default: true
      review_video:
        description: "Record the App Review screen recording (iPhone only, replaces the normal suite)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: orundocs-ios
  cancel-in-progress: false

jobs:
  archive:
    if: ${{ inputs.run_archive }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ios-ci
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare project (npm ci, web build, cap sync ios)
        run: |
          set -euo pipefail
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/od" && tar -xzf ios-ci/src.tar.gz -C "$RUNNER_TEMP/od"
          cd "$RUNNER_TEMP/od"
          # the three splash PNGs are identical; only one is shipped in src.tar.gz (upload size limit)
          SP=ios/App/App/Assets.xcassets/Splash.imageset
          for n in 1 2; do [ -f "$SP/splash-2732x2732-$n.png" ] || cp "$SP/splash-2732x2732.png" "$SP/splash-2732x2732-$n.png"; done
          npm ci --no-audit --no-fund
          node scripts/build-android.cjs
          npx cap sync ios
      - name: Archive Release (unsigned, generic iOS device)
        working-directory: ${{ runner.temp }}/od/ios/App
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/out/OrunDocs.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > "$RUNNER_TEMP/out/archive.log" 2>&1
          rc=$?
          grep -E "error:|warning:.*(OrunPlugins|SceneDelegate|AppDelegate)" "$RUNNER_TEMP/out/archive.log" | head -80 || true
          tail -25 "$RUNNER_TEMP/out/archive.log"
          exit $rc
      - name: Verify archive
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/out/OrunDocs.xcarchive/Products/Applications/App.app"
          P="$APP/Info.plist"
          V="$RUNNER_TEMP/out/verify.txt"
          {
            for k in CFBundleIdentifier CFBundleName CFBundleShortVersionString CFBundleVersion CFBundleDisplayName NSCameraUsageDescription NSPhotoLibraryUsageDescription MinimumOSVersion; do
              echo "$k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$P")"
            done
            echo "UIDeviceFamily = $(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$P" | tr -d '\n ')"
            echo "public/index.html present: $(test -f "$APP/public/index.html" && echo yes || echo no)"
            echo "EXAM_SCAN_WORKER_SHA256=$(shasum -a 256 "$APP/public/exam-scan-worker.js" | cut -d' ' -f1)"
            echo "codesign: $(codesign -dv "$APP" 2>&1 | head -1 || true)"
            if grep -rl "OD_TEST_RT" "$APP" "$RUNNER_TEMP/out/OrunDocs.xcarchive" ; then echo "OD_TEST_RT_IN_RELEASE=FOUND"; else echo "OD_TEST_RT_IN_RELEASE=absent"; fi
            if grep -rl "installTestSessionHook" "$APP"; then echo "HOOK_SYMBOL_IN_RELEASE=FOUND"; else echo "HOOK_SYMBOL_IN_RELEASE=absent"; fi
            echo "plugins in binary: $(strings "$APP/App" | grep -E '^(OrunAuth|AtelierSaf|AtelierShare)$' | sort -u | tr '\n' ' ')"
            ls -la "$APP" | head -40
          } | tee "$V"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$P")" = "com.orundocs.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$P")" = "4.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$P")" = "옳은PDF"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$P")" = "옳은PDF"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$P")" = "4"
          grep -q "OD_TEST_RT_IN_RELEASE=absent" "$V"
          python3 - "$APP/public" <<'PYEOF' | tee -a "$V"
          import sys, os
          root = sys.argv[1]
          s = open(os.path.join(root, "auth-gate.js"), encoding="utf-8").read()
          lit = "\uc633\uc740\uc601\uc5b4 \uae40\uc131\uc9c4T \ubb38\uc11c \uc791\uc5c5 \uacf5\uac04"
          esc = "".join("\\u%04x" % ord(c) if ord(c) > 127 else c for c in lit)
          found = lit in s or esc.lower() in s.lower()
          print("GATE_SUBTITLE_IN_RELEASE=" + ("FOUND" if found else "absent"))
          def forms(t):
              u = "".join("\\u%04x" % ord(c) if ord(c) > 127 else c for c in t)
              x = "".join(("\\x%02x" % ord(c)) if 127 < ord(c) <= 255 else ("\\u%04x" % ord(c) if ord(c) > 255 else c) for c in t)
              return [t.lower(), u.lower(), x.lower()]
          low = s.lower()
          for name, t in [("LOGIN_BUTTON", "\ub85c\uadf8\uc778 (Google \u00b7 Apple)"), ("DELETE_ACCOUNT", "\uacc4\uc815 \uc0ad\uc81c")]:
              print(name + "_IN_RELEASE=" + ("present" if any(f in low for f in forms(t)) else "MISSING"))
          idx = open(os.path.join(root, "index.html"), encoding="utf-8").read()
          print("CSP_IDENTITYTOOLKIT=" + ("present" if "https://identitytoolkit.googleapis.com" in idx else "MISSING"))
          print("INDEX_HTML_APP_NAME=" + ("present" if "\uc633\uc740PDF" in idx else "MISSING"))
          css = open(os.path.join(root, "android.css"), encoding="utf-8").read()
          print("STATUSBAR_BACKDROP_CSS=" + ("present" if "body::before" in css and "safe-area-inset-top" in css else "missing"))
          PYEOF
          grep -q "GATE_SUBTITLE_IN_RELEASE=absent" "$V"
          grep -q "LOGIN_BUTTON_IN_RELEASE=present" "$V"
          grep -q "CSP_IDENTITYTOOLKIT=present" "$V"
          grep -q "INDEX_HTML_APP_NAME=present" "$V"
          cd "$RUNNER_TEMP/out"
          ditto -c -k --sequesterRsrc --keepParent OrunDocs.xcarchive OrunDocs-4.0.0-build4-unsigned.xcarchive.zip
          shasum -a 256 OrunDocs-4.0.0-build4-unsigned.xcarchive.zip | tee -a "$V"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orundocs-ios-unsigned-xcarchive
          retention-days: 14
          path: |
            ${{ runner.temp }}/out/OrunDocs-4.0.0-build4-unsigned.xcarchive.zip
            ${{ runner.temp }}/out/verify.txt
            ${{ runner.temp }}/out/archive.log

  uitest:
    if: ${{ inputs.run_tests }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TEST_RUNNER_OD_REVIEW_EMAIL: ${{ secrets.OD_REVIEW_EMAIL }}
      TEST_RUNNER_OD_REVIEW_PASSWORD: ${{ secrets.OD_REVIEW_PASSWORD_V2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ios-ci
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare project (npm ci, web build, cap sync ios)
        run: |
          set -euo pipefail
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/od" && tar -xzf ios-ci/src.tar.gz -C "$RUNNER_TEMP/od"
          cd "$RUNNER_TEMP/od"
          # the three splash PNGs are identical; only one is shipped in src.tar.gz (upload size limit)
          SP=ios/App/App/Assets.xcassets/Splash.imageset
          for n in 1 2; do [ -f "$SP/splash-2732x2732-$n.png" ] || cp "$SP/splash-2732x2732.png" "$SP/splash-2732x2732-$n.png"; done
          npm ci --no-audit --no-fund
          node scripts/build-android.cjs
          npx cap sync ios
      - name: Fresh review-account refresh token for the debug-hook fallback (never printed)
        env:
          RE: ${{ secrets.OD_REVIEW_EMAIL }}
          RP: ${{ secrets.OD_REVIEW_PASSWORD_V2 }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, urllib.request
          src = open(os.path.join(os.environ["RUNNER_TEMP"], "od/src/auth/orundocs-auth-core.mjs"), encoding="utf-8").read()
          key = re.search(r"apiKey:\s*['\"]([^'\"]+)", src).group(1)
          body = json.dumps({"email": os.environ["RE"], "password": os.environ["RP"], "returnSecureToken": True}).encode()
          try:
              r = urllib.request.urlopen(urllib.request.Request("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + key, data=body, headers={"content-type": "application/json"}), timeout=30)
              rt = json.load(r).get("refreshToken", "")
          except Exception as e:
              rt = ""; print("signInWithPassword failed:", type(e).__name__)
          if rt:
              print("::add-mask::" + rt)
              with open(os.environ["GITHUB_ENV"], "a") as f: f.write("TEST_RUNNER_OD_TEST_RT=" + rt + "\n")
              print("fresh review refresh token obtained (masked)")
          else:
              print("no fresh token; debug-hook fallback unavailable")
          PYEOF
      - name: Add UI test target (CI copy only)
        working-directory: ${{ runner.temp }}/od/ios/App
        run: |
          set -euo pipefail
          gem list -i xcodeproj >/dev/null || gem install xcodeproj --no-document
          ruby "$GITHUB_WORKSPACE/ios-ci/add_uitests.rb" App.xcodeproj "$GITHUB_WORKSPACE/ios-ci/uitests/OrunUITests.swift"
      - name: Build for testing (Debug, simulator)
        working-directory: ${{ runner.temp }}/od/ios/App
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          xcodebuild build-for-testing -project App.xcodeproj -scheme AppUITests -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/out/build-for-testing.log" 2>&1
          rc=$?
          grep -E "error:|warning:.*(OrunPlugins|SceneDelegate|OrunUITests)" "$RUNNER_TEMP/out/build-for-testing.log" | head -80 || true
          tail -25 "$RUNNER_TEMP/out/build-for-testing.log"
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          if grep -rlq "OD_TEST_RT" "$APP"; then echo "Debug build contains OD_TEST_RT hook (expected)"; else echo "Debug build lacks OD_TEST_RT hook"; fi
          exit $rc
      - name: Pick simulators
        id: sims
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          rts=[k for k in d if "iOS" in k and d[k]]
          rts.sort(key=lambda k:[int(x) for x in re.findall(r"\d+",k.split("iOS")[-1])])
          devs=d[rts[-1]]
          def pick(prefs,kind):
              for p in prefs:
                  for x in devs:
                      if x["name"]==p: return x
              return next(x for x in devs if x["name"].startswith(kind))
          a=pick(["iPhone 17 Pro Max","iPhone 16 Pro Max","iPhone Air"],"iPhone")
          b=pick(["iPad Pro 13-inch (M4)","iPad Pro 13-inch (M5)","iPad Air 13-inch (M3)"],"iPad")
          print("iphone="+a["udid"]); print("ipad="+b["udid"])
          print("names="+a["name"]+" / "+b["name"]+" / "+rts[-1])
          ' | tee -a "$GITHUB_OUTPUT"
      - name: App Review screen recording (iPhone)
        if: ${{ inputs.review_video }}
        working-directory: ${{ runner.temp }}/od/ios/App
        env:
          TEST_RUNNER_OD_RECORD: "1"
          TEST_RUNNER_OD_DEMO_EMAIL: ${{ secrets.OD_DEMO_DELETE_EMAIL }}
          TEST_RUNNER_OD_DEMO_PASSWORD: ${{ secrets.OD_DEMO_DELETE_PASSWORD }}
        run: |
          set +e
          udid="${{ steps.sims.outputs.iphone }}"
          R="$RUNNER_TEMP/out/review"; S="$RUNNER_TEMP/out/shots/iphone"
          mkdir -p "$R/frames" "$S"
          command -v ffmpeg >/dev/null || brew install ffmpeg >/dev/null 2>&1
          ffmpeg -version | head -1
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl addmedia "$udid" "$GITHUB_WORKSPACE/ios-ci/fixtures/exam-photo.jpg"
          xcrun simctl status_bar "$udid" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl uninstall "$udid" com.orundocs.app || true
          sleep 3
          xcrun simctl io "$udid" recordVideo --codec=h264 --force "$R/raw.mp4" > "$R/record.log" 2>&1 &
          REC=$!
          for i in $(seq 1 30); do grep -qi "recording started" "$R/record.log" && break; sleep 0.5; done
          python3 -c 'import time;print("%.3f" % time.time())' > "$R/start.txt"
          cat "$R/record.log"
          TEST_RUNNER_OD_SHOTS="$S" xcodebuild test-without-building -project App.xcodeproj -scheme AppUITests \
            -destination "id=$udid" -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/xcresult-review" \
            -only-testing:AppUITests/OrunUITests/test9_ReviewRecording > "$RUNNER_TEMP/out/test-review.log" 2>&1
          echo "xcodebuild exit=$?"
          sleep 2
          kill -INT $REC; wait $REC
          grep -E "ODRESULT|Test Case .*(passed|failed)|error:" "$RUNNER_TEMP/out/test-review.log" | head -40
          cat "$S/markers.txt" || true
          ls -la "$R"
          python3 - "$R" "$S/markers.txt" <<'PYEOF'
          import os, subprocess, sys, json
          R, M = sys.argv[1], sys.argv[2]
          start = float(open(os.path.join(R, "start.txt")).read().strip())
          marks = [(float(l.split(" ", 1)[0]) - start, l.split(" ", 1)[1].strip()) for l in open(M) if l.strip()] if os.path.exists(M) else []
          first = dict((n, t) for t, n in marks)
          t0 = max(0.0, first["01-home-screen"] - 1.5) if "01-home-screen" in first else (max(0.0, first["02-gate"] - 5.0) if "02-gate" in first else 0.0)
          raw, out = os.path.join(R, "raw.mp4"), os.path.join(R, "orundocs-review.mp4")
          def enc(h, crf):
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-ss", "%.2f" % t0, "-i", raw, "-vf", "fps=30,scale=-2:%d" % h,
                              "-c:v", "libx264", "-preset", "medium", "-crf", str(crf), "-pix_fmt", "yuv420p", "-an", "-movflags", "+faststart", out], check=True)
          enc(1920, 26)
          if os.path.getsize(out) > 58 * 1024 * 1024: enc(1080, 28)
          dur = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", out], capture_output=True, text=True).stdout.strip()
          for t, n in marks:
              off = t - t0 + 0.4
              if off > 0:
                  subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-ss", "%.2f" % off, "-i", out, "-frames:v", "1", os.path.join(R, "frames", n + ".png")])
          info = {"trim_start_s": round(t0, 2), "duration_s": dur, "size_bytes": os.path.getsize(out), "markers": [[n, round(t - t0, 2)] for t, n in marks]}
          json.dump(info, open(os.path.join(R, "video-info.json"), "w"), indent=1, ensure_ascii=False)
          print(json.dumps(info, ensure_ascii=False))
          PYEOF
          rm -f "$R/raw.mp4"
          shasum -a 256 "$R/orundocs-review.mp4" | tee "$R/sha256.txt"
          cat "$S"/results-*.txt || true
      - name: UI tests on iPhone and iPad
        if: ${{ !inputs.review_video }}
        working-directory: ${{ runner.temp }}/od/ios/App
        run: |
          set +e
          set -u
          if [ -z "${TEST_RUNNER_OD_TEST_RT:-}" ]; then echo "::warning::OD_TEST_REFRESH_TOKEN secret missing"; fi
          run_dev() {
            name=$1; udid=$2
            mkdir -p "$RUNNER_TEMP/out/shots/$name"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl addmedia "$udid" "$GITHUB_WORKSPACE/ios-ci/fixtures/exam-photo.jpg"
            xcrun simctl status_bar "$udid" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || echo "status_bar override failed"
            G=$(xcrun simctl get_app_container "$udid" com.apple.DocumentsApp groups 2>/dev/null | grep -i LocalStorage | sed 's#^[^/]*##')
            if [ -n "$G" ]; then mkdir -p "$G/File Provider Storage" && cp "$GITHUB_WORKSPACE/ios-ci/fixtures/preview-six-pages.pdf" "$G/File Provider Storage/" && echo "PDF fixture placed in On My device storage"; ls -la "$G/File Provider Storage"; else echo "Files local storage container not found"; xcrun simctl get_app_container "$udid" com.apple.DocumentsApp groups || true; fi
            xcrun simctl uninstall "$udid" com.orundocs.app || true
            TEST_RUNNER_OD_SHOTS="$RUNNER_TEMP/out/shots/$name" xcodebuild test-without-building -project App.xcodeproj -scheme AppUITests \
              -destination "id=$udid" -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/xcresult-$name" \
              > "$RUNNER_TEMP/out/test-$name.log" 2>&1
            echo "$name xcodebuild exit=$?"
            grep -E "ODRESULT|Test Case .*(passed|failed)|error:" "$RUNNER_TEMP/out/test-$name.log" | head -60
            xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/out/shots/$name/zz-final.png" || true
            xcrun simctl shutdown "$udid" || true
          }
          run_dev iphone "${{ steps.sims.outputs.iphone }}"
          if [ "${{ inputs.ipad }}" = "true" ]; then run_dev ipad "${{ steps.sims.outputs.ipad }}"; else echo "iPad skipped (input ipad=false)"; fi
          cat "$RUNNER_TEMP"/out/shots/*/results-*.txt || true
      - name: Redact secret from evidence files
        if: always()
        run: |
          python3 - <<'EOF'
          import os
          toks = [os.environ.get(k, "") for k in ("TEST_RUNNER_OD_TEST_RT", "TEST_RUNNER_OD_REVIEW_PASSWORD", "TEST_RUNNER_OD_REVIEW_EMAIL")]
          toks = [t for t in toks if len(t) >= 4]
          root = os.path.join(os.environ["RUNNER_TEMP"], "out")
          n = 0
          if toks and os.path.isdir(root):
              for dp, _, fs in os.walk(root):
                  for f in fs:
                      p = os.path.join(dp, f)
                      if f.endswith((".log", ".txt")):
                          s = open(p, "rb").read(); o = s
                          if f.endswith(".log"):
                              # XCTest echoes typed text ("Type '...' into"): drop those lines entirely
                              s = b"\n".join(l for l in s.split(b"\n") if b"Type '" not in l and b"typeText" not in l)
                          for tok in toks:
                              vs = {tok, tok.lower()}
                              if "@" in tok and len(tok.split("@")[0]) >= 4: vs.add(tok.split("@")[0]); vs.add(tok.split("@")[0].lower())
                              for v in sorted(vs, key=len, reverse=True):
                                  s = s.replace(v.encode(), b"***")
                          if s != o:
                              open(p, "wb").write(s); n += 1
          print("redacted files:", n)
          # final leak scan over EVERY file that will be uploaded (text and binary): must be 0
          leaks = 0
          if toks and os.path.isdir(root):
              for dp, _, fs in os.walk(root):
                  for f in fs:
                      p = os.path.join(dp, f)
                      b = open(p, "rb").read()
                      hit = any(t.encode() in b or t.lower().encode() in b for t in toks) or b"::add-mask::" in b
                      if hit:
                          leaks += 1
                          os.remove(p)
          print("secret/token matches remaining in artifact files:", leaks, "(any such file was deleted)")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orundocs-ios-uitest-evidence
          retention-days: 14
          path: |
            ${{ runner.temp }}/out/shots
            ${{ runner.temp }}/out/review
            ${{ runner.temp }}/out/*.log
