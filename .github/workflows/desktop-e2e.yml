name: desktop-e2e

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which OS jobs to run"
        required: false
        default: both
        type: choice
        options:
          - both
          - windows
          - macos

permissions:
  contents: read

env:
  RELEASE_TAG: desktop-test-4.0.0

jobs:
  windows:
    if: ${{ inputs.target == 'both' || inputs.target == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci-desktop
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact installer from pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\bin" | Out-Null
          gh release download $env:RELEASE_TAG -R $env:GITHUB_REPOSITORY -p 'OrunPDF-Setup-4.0.0-x64.exe' -p 'OrunDocs-Setup-4.0.0-x64.exe' -D "$env:RUNNER_TEMP\bin"
          Get-FileHash "$env:RUNNER_TEMP\bin\*.exe" -Algorithm SHA256 | Format-List
          Get-ComputerInfo -Property OsName,OsVersion,OsBuildNumber,WindowsVersion | Format-List
          query user 2>&1; whoami
      - name: Install playwright-core
        shell: pwsh
        working-directory: ci-desktop
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          node -e "console.log('playwright-core', require('playwright-core/package.json').version)"
      - name: Install, E2E, uninstall (real setup exe)
        shell: pwsh
        env:
          OD_REVIEW_EMAIL: ${{ secrets.OD_REVIEW_EMAIL }}
          OD_REVIEW_PASSWORD: ${{ secrets.OD_REVIEW_PASSWORD_V2 }}
        run: node ci-desktop/win-flow.cjs "$env:RUNNER_TEMP\bin\OrunPDF-Setup-4.0.0-x64.exe" "$env:RUNNER_TEMP\evidence-windows" "$env:RUNNER_TEMP\bin\OrunDocs-Setup-4.0.0-x64.exe"
      - name: Sanitize evidence (strip add-mask lines and token-like strings before upload)
        if: always()
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\evidence-windows"
          if (Test-Path $root) {
            Get-ChildItem $root -Recurse -File -Include *.txt,*.json,*.log | ForEach-Object {
              $c = Get-Content -LiteralPath $_.FullName -Raw -Encoding utf8
              $n = ($c -split "`n" | Where-Object { $_ -notmatch '::add-mask::' }) -join "`n"
              $n = $n -replace 'AMf-v[A-Za-z0-9_-]{20,}', '[REDACTED]' -replace 'eyJhbGci[A-Za-z0-9._-]{20,}', '[REDACTED]'
              if ($n -ne $c) { Set-Content -LiteralPath $_.FullName -Value $n -Encoding utf8 -NoNewline; "sanitized $($_.Name)" }
            }
          }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-windows
          path: ${{ runner.temp }}/evidence-windows
          retention-days: 2
          if-no-files-found: warn

  macos:
    if: ${{ inputs.target == 'both' || inputs.target == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci-desktop
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact notarized ZIP from pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p 'OrunPDF-4.0.0-mac-arm64-notarized.zip' -D "$RUNNER_TEMP/bin"
          shasum -a 256 "$RUNNER_TEMP/bin/OrunPDF-4.0.0-mac-arm64-notarized.zip"
      - name: Install playwright-core
        working-directory: ci-desktop
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          node -e "console.log('playwright-core', require('playwright-core/package.json').version)"
      - name: Verify, install, E2E, build DMG
        env:
          OD_REVIEW_EMAIL: ${{ secrets.OD_REVIEW_EMAIL }}
          OD_REVIEW_PASSWORD: ${{ secrets.OD_REVIEW_PASSWORD_V2 }}
        run: bash ci-desktop/mac-flow.sh "$RUNNER_TEMP/bin/OrunPDF-4.0.0-mac-arm64-notarized.zip" "$RUNNER_TEMP/evidence-macos" "$RUNNER_TEMP/dmg"
      - name: Sanitize evidence (strip add-mask lines and token-like strings before upload)
        if: always()
        run: |
          root="$RUNNER_TEMP/evidence-macos"
          [ -d "$root" ] && find "$root" -type f \( -name '*.txt' -o -name '*.json' -o -name '*.log' -o -name '*.tsv' \) -print0 | while IFS= read -r -d '' f; do
            if grep -qE '::add-mask::|AMf-v[A-Za-z0-9_-]{20}|eyJhbGci[A-Za-z0-9._-]{20}' "$f"; then
              sed -i '' -E '/::add-mask::/d; s/AMf-v[A-Za-z0-9_-]{20,}/[REDACTED]/g; s/eyJhbGci[A-Za-z0-9._-]{20,}/[REDACTED]/g' "$f"; echo "sanitized $f"
            fi
          done
          true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-macos
          path: ${{ runner.temp }}/evidence-macos
          retention-days: 2
          if-no-files-found: warn
      - name: Upload unsigned DMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrunPDF-4.0.0-mac-arm64-dmg
          path: ${{ runner.temp }}/dmg
          retention-days: 2
          compression-level: 0
          if-no-files-found: warn
