name: OrunDocs Android private build and verification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build unsigned APKs or verify the locally signed APKs
        type: choice
        options:
          - build
          - verify-signed
        default: build
        required: true

permissions:
  contents: read

concurrency:
  group: orundocs-android-private
  cancel-in-progress: false

env:
  SOURCE_SHA256: 23be3c5e0f76c353b071b1c40ecf588e4682242c9375e923fdbe775402b71579

defaults:
  run:
    working-directory: orundocs

jobs:
  build:
    if: inputs.mode == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source-only capsule
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  source.zip\n' "$SOURCE_SHA256" | sha256sum -c -
          unzip -q source.zip -d project
          test ! -e project/android/local.properties
          if find project -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.p8' -o -name '*.pem' \) | grep -q .; then
            echo 'Signing credential found in source capsule'; exit 1
          fi
      - name: Local frontend and twenty regression checks
        working-directory: orundocs/project
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --test frontend-tests/*.test.mjs
          PDF_PREVIEW_TEST_TMP="$RUNNER_TEMP/pdf-preview-actions" node ci/test-preview-actions.cjs
          npm exec cap sync android
      - name: Install only stable Android build packages
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile release and matching release-instrumentation APKs
        working-directory: orundocs/project/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest :app:bundleRelease -PsmokeBuildType=release --no-daemon --console=plain --max-workers=2
      - name: Prepare unsigned APKs and public build metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output/build
          cp project/android/app/build/outputs/apk/release/app-release-unsigned.apk ci-output/build/app-release-unsigned.apk
          TEST_APK=$(find project/android/app/build/outputs/apk/androidTest/release -name '*.apk' -type f | head -n 1)
          test -n "$TEST_APK"
          cp "$TEST_APK" ci-output/build/app-release-androidTest.apk
          cp source-manifest.json ci-output/build/source-manifest.json
          cp project/android/app/build/outputs/bundle/release/app-release.aab ci-output/build/app-release-unsigned.aab
          unzip -p ci-output/build/app-release-unsigned.apk assets/public/open-source-notices.txt > ci-output/build/open-source-notices.txt
          grep -q 'docx@9.5.1' ci-output/build/open-source-notices.txt
          grep -q 'pptxgenjs@4.0.1' ci-output/build/open-source-notices.txt
          grep -q 'exceljs@4.4.0' ci-output/build/open-source-notices.txt
          grep -q 'Permission is hereby granted' ci-output/build/open-source-notices.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging ci-output/build/app-release-unsigned.apk > ci-output/build/release-badging.txt
          grep -q "package: name='com.orundocs.app'.*versionCode='4000003'.*versionName='4.0.0'" ci-output/build/release-badging.txt
          if grep -q '^application-debuggable' ci-output/build/release-badging.txt; then echo 'Release is debuggable'; exit 1; fi
          sha256sum ci-output/build/*.apk > ci-output/build/SHA256SUMS
          test "$(du -sm ci-output/build | cut -f1)" -lt 80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orundocs-unsigned-release
          path: orundocs/ci-output/build
          retention-days: 1
          if-no-files-found: error

  verify_signed:
    if: inputs.mode == 'verify-signed'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify locally signed binaries and source identity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const m=JSON.parse(fs.readFileSync('signed-manifest.json','utf8'));
          if(m.sourceSha256!==process.env.SOURCE_SHA256)throw Error('Signed APK source identity mismatch');
          for(const [file,key] of [['app-release.apk','appSha256'],['app-release-androidTest.apk','testSha256']]){
            const hash=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if(hash!==m[key])throw Error('Signed artifact checksum mismatch: '+file);
          }
          NODE
      - name: Install only stable Android test packages
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'build-tools;36.0.0' 'emulator' 'system-images;android-35;default;x86_64'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app-release.apk > app-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app-release-androidTest.apk > test-signature.txt
          diff <(grep 'certificate SHA-256 digest:' app-signature.txt) <(grep 'certificate SHA-256 digest:' test-signature.txt)
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging app-release.apk > release-badging.txt
          grep -q "package: name='com.orundocs.app'.*versionCode='4000003'.*versionName='4.0.0'" release-badging.txt
          if grep -q '^application-debuggable' release-badging.txt; then echo 'Release is debuggable'; exit 1; fi
      - name: Start clean standard Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
          test -r /dev/kvm && test -w /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/orundocs-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n PDFAtelierCI -k 'system-images;android-35;default;x86_64' --device pixel_5 --path "$ANDROID_AVD_HOME/PDFAtelierCI.avd"
          test -f "$ANDROID_AVD_HOME/PDFAtelierCI.avd/config.ini"
          if [ ! -f "$ANDROID_AVD_HOME/PDFAtelierCI.ini" ]; then
            printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/PDFAtelierCI.avd" > "$ANDROID_AVD_HOME/PDFAtelierCI.ini"
          fi
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx PDFAtelierCI
          "$ANDROID_HOME/emulator/emulator" -avd PDFAtelierCI -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -accel on -cores 4 -memory 4096 -skin 720x1280 > emulator.log 2>&1 &
          if ! timeout 180 adb wait-for-device; then
            echo "Emulator did not connect; startup diagnostics follow"
            tail -n 120 emulator.log || true
            exit 1
          fi
          BOOTED=0
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then BOOTED=1; break; fi
            sleep 2
          done
          if [ "$BOOTED" != 1 ]; then tail -n 120 emulator.log || true; exit 1; fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm density 320
          # CI-owned emulator only: system ANR/crash dialogs from the software-rendered launcher would cover the app under test.
          adb shell settings put global hide_error_dialogs 1
          adb shell input keyevent 82
          sleep 20
      - name: Install exact locally signed release and test APKs
        id: install_signed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output
          adb install app-release.apk
          adb install -t app-release-androidTest.apk
      - name: Run exact signed release through real WebView and DocumentsUI
        if: ${{ !cancelled() && steps.install_signed.outcome == 'success' }}
        shell: bash
        env:
          OD_REVIEW_EMAIL: ${{ secrets.OD_REVIEW_EMAIL }}
          OD_REVIEW_PASSWORD: ${{ secrets.OD_REVIEW_PASSWORD_V2 }}
        run: |
          set -euo pipefail
          mkdir -p ci-output
          OD_TEST_REFRESH_TOKEN=$(node -e 'fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=AIzaSyCtvGwVSwR0YoxPwNiVBLAWTDkyr-hDh3c",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:process.env.OD_REVIEW_EMAIL,password:process.env.OD_REVIEW_PASSWORD,returnSecureToken:true})}).then(r=>r.json()).then(j=>process.stdout.write(j.refreshToken||""))' || true)
          echo "::add-mask::$OD_TEST_REFRESH_TOKEN"
          EXTRA=()
          if [ -n "${OD_TEST_REFRESH_TOKEN:-}" ]; then EXTRA=(-e odRefreshToken "$OD_TEST_REFRESH_TOKEN"); fi
          timeout 600 adb shell am instrument -w -r "${EXTRA[@]}" -e class com.pdfatelier.android.NativeWebViewSmokeTest -e smokeArtifactDir /sdcard/Android/data/com.orundocs.app/files/native-smoke com.orundocs.app.test/androidx.test.runner.AndroidJUnitRunner | tr -d '\r' | tee ci-output/instrumentation.txt
          grep -Eq '^OK \([1-9][0-9]* tests?\)' ci-output/instrumentation.txt
          if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' ci-output/instrumentation.txt; then exit 1; fi
      - name: Collect native evidence on success and failure
        id: collect
        if: always()
        shell: bash
        run: |
          mkdir -p ci-output
          cp emulator.log ci-output/emulator.log 2>/dev/null || true
          timeout 20 adb pull /sdcard/Android/data/com.orundocs.app/files/native-smoke ci-output/native-smoke || true
          timeout 10 adb logcat -d -s AtelierNativeSmoke:I '*:S' > ci-output/native-smoke-logcat.txt || true
          timeout 10 adb logcat -d -t 1500 > ci-output/android-system-logcat.txt || true
          timeout 10 adb shell dumpsys webviewupdate > ci-output/webview-provider.txt || true
          cp app-signature.txt test-signature.txt release-badging.txt signed-manifest.json ci-output/ 2>/dev/null || true
          if [ "$(du -sm ci-output | cut -f1)" -ge 100 ]; then echo 'Evidence exceeds free-storage guard'; exit 1; fi
          echo 'safe=true' >> "$GITHUB_OUTPUT"
      - name: Require actual native success marker
        run: |
          test -f ci-output/native-smoke/PASS.txt
          grep -q 'LOGIN_ALLOWED_PATH=' ci-output/native-smoke-logcat.txt
          grep 'LOGIN_ALLOWED_PATH=' ci-output/native-smoke-logcat.txt | tail -n 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.collect.outputs.safe == 'true'
        with:
          name: orundocs-signed-native-verification
          path: orundocs/ci-output
          retention-days: 1
          if-no-files-found: error
      - name: Stop owned test emulator
        if: always()
        run: timeout 10 adb emu kill || true
